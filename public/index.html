<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐍 Snake Battle Royale</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 主菜单：模式选择 -->
    <div id="menu" class="panel">
      <h1>🐍 贪吃蛇大逃杀</h1>
      <p class="subtitle">选择游戏模式</p>

      <div class="mode-cards">
        <div class="mode-card" data-mode="single">
          <div class="mode-icon">🎮</div>
          <h3>单机模式</h3>
          <p>经典贪吃蛇，挑战最高分</p>
        </div>

        <div class="mode-card" data-mode="ai">
          <div class="mode-icon">🤖</div>
          <h3>人机对战</h3>
          <p>与 AI 蛇对战，争夺冠军</p>
        </div>

        <div class="mode-card" data-mode="multiplayer">
          <div class="mode-icon">🌐</div>
          <h3>联机对战</h3>
          <p>邀请朋友一起玩</p>
        </div>
      </div>
    </div>

    <!-- 人机配置面板 -->
    <div id="aiConfig" class="panel" style="display:none;">
      <h2>🤖 人机对战</h2>

      <div class="form-group">
        <label>对手数量</label>
        <div class="btn-group" id="botCountGroup">
          <button class="btn-group-btn" data-count="3">3</button>
          <button class="btn-group-btn active" data-count="4">4</button>
          <button class="btn-group-btn" data-count="5">5</button>
          <button class="btn-group-btn" data-count="7">7</button>
        </div>
      </div>

      <div class="form-group">
        <label>难度</label>
        <div class="btn-group" id="difficultyGroup">
          <button class="btn-group-btn" data-diff="easy">简单</button>
          <button class="btn-group-btn active" data-diff="medium">中等</button>
          <button class="btn-group-btn" data-diff="hard">困难</button>
        </div>
      </div>

      <div class="btn-row" style="margin-top: 24px;">
        <button id="btnAIStart" class="btn btn-danger btn-large">开始对战</button>
      </div>
      <button id="btnAIBack" class="btn btn-secondary" style="width:100%;margin-top:8px;">返回</button>
    </div>

    <!-- 联机设置面板 -->
    <div id="multiplayerSetup" class="panel" style="display:none;">
      <h2>🌐 联机对战</h2>

      <div class="form-group">
        <label>你的昵称</label>
        <input id="mpNameInput" type="text" maxlength="8" placeholder="输入昵称…" />
      </div>

      <div class="btn-row">
        <button id="btnCreate" class="btn btn-primary">创建房间</button>
      </div>

      <div class="divider"><span>或</span></div>

      <div class="form-group">
        <label>加入房间</label>
        <div class="join-row">
          <input id="roomInput" type="text" maxlength="4" placeholder="房间号" />
          <button id="btnJoin" class="btn btn-secondary">加入</button>
        </div>
      </div>

      <details class="advanced-settings">
        <summary>⚙️ 高级设置（网桥模式）</summary>
        <div class="form-group" style="margin-top:12px;">
          <label>服务器地址</label>
          <input id="serverUrlInput" type="text" placeholder="例：192.168.1.100:3000" />
          <p class="hint">如果通过网桥连接，请填写运行服务器的电脑 IP 和端口</p>
        </div>
      </details>

      <button id="btnMPBack" class="btn btn-secondary" style="width:100%;margin-top:12px;">返回</button>
    </div>

    <!-- 房间大厅 -->
    <div id="lobby" class="panel" style="display:none;">
      <div class="lobby-header">
        <h2>🏠 房间大厅</h2>
      </div>

      <div class="room-info">
        <p>房间号：<strong id="lobbyRoomId"></strong></p>
        <p class="hint">把房间号发给朋友，让他们加入！</p>
      </div>

      <h3>玩家列表</h3>
      <ul id="playerList"></ul>

      <div class="btn-row">
        <button id="btnStart" class="btn btn-danger btn-large">开始游戏！</button>
        <button id="btnLeaveLobby" class="btn btn-secondary">离开</button>
      </div>
    </div>

    <!-- 游戏界面 -->
    <div id="game" style="display:none;">
      <div id="gameHeader">
        <span id="aliveCount">存活：0</span>
        <span id="gameTimer">00:00</span>
      </div>
      <canvas id="gameCanvas"></canvas>
      <div id="gameStatus">
        <span>WASD / 方向键 控制方向</span>
      </div>
      <!-- 击杀日志 -->
      <div id="killFeed"></div>
    </div>

    <!-- 结算界面 -->
    <div id="result" class="panel" style="display:none;">
      <h1 id="resultTitle"></h1>
      <div id="winnerInfo"></div>
      <h3>排行榜</h3>
      <ol id="rankingList"></ol>
      <button id="btnBackToMenu" class="btn btn-primary">返回大厅</button>
    </div>

    <!-- 连接状态 -->
    <div id="connectionStatus">未连接</div>
  </div>

  <!-- 脚本加载（依赖顺序） -->
  <script src="game-engine.js"></script>
  <script src="ai-player.js"></script>
  <script src="renderer.js"></script>
  <script src="single-player.js"></script>
  <script src="ai-mode.js"></script>
  <script src="client.js"></script>
</body>
</html>
